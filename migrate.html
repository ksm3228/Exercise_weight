function log(msg, cls='info'){
  const el = document.getElementById('log');
  el.style.display = 'block';
  el.innerHTML += `<div class="${cls}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

window.run = async () => {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = '로그인 중…';
  try {
    const provider = new GoogleAuthProvider();
    const result = await signInWithPopup(auth, provider);
    const uid = result.user.uid;
    log(`✓ 로그인: ${result.user.displayName || result.user.email}`, 'ok');
    btn.textContent = '업로드 중…';
    const entries = Object.entries(HISTORICAL_DATA);
    log(`총 ${entries.length}개 항목 업로드 시작…`);
    let ok = 0, fail = 0;
    for(const [key, data] of entries){
      try {
        await setDoc(doc(db, 'users', uid, 'entries', key), data);
        log(`✓ ${key}`, 'ok');
        ok++;
      } catch(e) {
        log(`✗ ${key}: ${e.message}`, 'err');
        fail++;
      }
    }
    log(`━━━━━━━━━━━━━━━━━━━━`, 'info');
    log(`완료: 성공 ${ok}개 / 실패 ${fail}개`, fail===0?'ok':'err');
    btn.textContent = fail===0 ? '✓ 업로드 완료! 앱으로 돌아가세요' : '일부 실패 — 로그 확인';
  } catch(e) {
    log(`오류: ${e.message}`, 'err');
    btn.disabled = false;
    btn.textContent = '다시 시도';
  }
};
